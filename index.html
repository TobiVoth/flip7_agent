<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip 7 – KI Live-Assistent (Original-Design)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Original-inspirierter Retro-Kartenstil */
    .flip7-card {
      background-color: #F4EEDC;
      background-image: radial-gradient(#E8DFC9 15%, transparent 16%);
      background-size: 10px 10px;
      border: 3px solid #1E293B;
      color: #1E293B;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    .flip7-card-bonus {
      background-color: #F59E0B;
      background-image: none;
      border: 3px solid #78350F;
      color: #FFFFFF;
    }
    .flip7-card-x2 {
      background-color: #9333EA;
      background-image: none;
      border: 3px solid #581C87;
      color: #FFFFFF;
    }
    .flip7-card-freeze {
      background-color: #38BDF8;
      background-image: none;
      border: 3px solid #0369A1;
      color: #FFFFFF;
    }
    .flip7-card-second {
      background-color: #EF4444;
      background-image: none;
      border: 3px solid #991B1B;
      color: #FFFFFF;
    }
    .flip7-card-fliptweet {
      background-color: #FACC15;
      background-image: none;
      border: 3px solid #A16207;
      color: #713F12;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 md:p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-4">

    <!-- Header & Runden-Steuerung -->
    <div class="flex flex-wrap justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800 gap-3 shadow-xl">
      <div>
        <h1 class="text-2xl font-black text-amber-500 tracking-wider">FLIP 7 <span class="text-xs font-normal text-slate-400">KI-Ratgeber</span></h1>
        <p class="text-xs text-slate-400">Reststapel: <span id="rem-total" class="font-bold text-white">94</span> Karten</p>
      </div>
      <div class="flex gap-2">
        <button onclick="postAction('/api/undo')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-2 rounded-lg text-xs font-bold transition">↩ Rückgängig</button>
        <button onclick="postAction('/api/reset_round')" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded-lg text-xs font-bold transition">Neue Runde</button>
        <button onclick="postAction('/api/reset_deck')" class="bg-rose-800 hover:bg-rose-700 px-3 py-2 rounded-lg text-xs font-bold transition">Neu mischen (94)</button>
      </div>
    </div>

    <!-- KI-Empfehlung & Cockpit -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div id="rec-box" class="bg-slate-900 p-5 rounded-xl border-2 border-emerald-500 flex flex-col justify-center items-center text-center shadow-xl">
        <span class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">KI-Empfehlung</span>
        <div id="rec-text" class="text-3xl font-black mt-1 text-emerald-400 tracking-wide">NOCH EINE</div>
        <span class="text-xs text-slate-400 mt-2">Critic-Erwartung: <b id="ev-val" class="text-white">0.0</b> Pkt.</span>
      </div>

      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 flex flex-col justify-center space-y-3 shadow-xl">
        <div>
          <div class="flex justify-between text-xs mb-1 font-bold">
            <span class="text-emerald-400">NOCH EINE (Ziehen)</span>
            <span id="prob-hit">0%</span>
          </div>
          <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
            <div id="bar-hit" class="bg-emerald-500 h-full transition-all duration-300" style="width: 50%"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between text-xs mb-1 font-bold">
            <span class="text-amber-400">STOPP (Passen)</span>
            <span id="prob-stop">0%</span>
          </div>
          <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
            <div id="bar-stop" class="bg-amber-500 h-full transition-all duration-300" style="width: 50%"></div>
          </div>
        </div>
      </div>

      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 flex flex-col justify-between shadow-xl text-sm">
        <div class="flex justify-between items-center">
          <span class="text-slate-400">Sichere Punkte:</span>
          <span id="cur-score" class="text-xl font-black text-amber-400">0</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-slate-400">Zahlenkarten:</span>
          <span id="unique-cnt" class="font-bold text-white">0 / 7</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-slate-400">Bust-Risiko:</span>
          <span id="bust-risk" class="font-bold text-rose-400">0.0%</span>
        </div>
      </div>
    </div>

    <!-- Eigene Hand-Auslage im Original-Look -->
    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-xl">
      <h2 class="text-xs uppercase tracking-wider text-slate-400 font-bold mb-2">Deine aktuelle Auslage</h2>
      <div id="my-hand-display" class="flex flex-wrap gap-2.5 min-h-[55px] items-center"></div>
    </div>

    <!-- Modus-Umschalter -->
    <div class="grid grid-cols-2 gap-3 bg-slate-900 p-2 rounded-xl border border-slate-800 shadow-xl">
      <button id="btn-mode-me" onclick="setTarget('me')" class="py-2.5 rounded-lg font-bold text-xs transition bg-emerald-600 text-white shadow-md">
        👤 Karte für MICH gezogen
      </button>
      <button id="btn-mode-other" onclick="setTarget('other')" class="py-2.5 rounded-lg font-bold text-xs transition bg-slate-800 text-slate-400">
        👥 Karte von MITSPIELER gezogen
      </button>
    </div>

    <!-- Eingabe-Grids im Kartendesign -->
    <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-xl space-y-4">
      <h3 class="text-xs uppercase tracking-wider text-slate-400 font-bold">Zahlenkarten (0 bis 12)</h3>
      <div id="grid-numbers" class="grid grid-cols-4 sm:grid-cols-7 gap-3"></div>

      <h3 class="text-xs uppercase tracking-wider text-slate-400 font-bold pt-2">Bonus- & Aktionskarten</h3>
      <div id="grid-specials" class="grid grid-cols-3 sm:grid-cols-5 gap-3"></div>
    </div>

  </div>

  <script>
    const API_URL = "http://localhost:8000";
    let currentTarget = "me";

    const SPECIAL_CARDS = [
      { key: "BONUS_2", label: "+2", style: "flip7-card-bonus" },
      { key: "BONUS_4", label: "+4", style: "flip7-card-bonus" },
      { key: "BONUS_6", label: "+6", style: "flip7-card-bonus" },
      { key: "BONUS_8", label: "+8", style: "flip7-card-bonus" },
      { key: "BONUS_10", label: "+10", style: "flip7-card-bonus" },
      { key: "BONUS_X2", label: "×2", style: "flip7-card-x2" },
      { key: "ACT_SECOND_CHANCE", label: "2nd Chance", style: "flip7-card-second" },
      { key: "ACT_FLIP_THREE", label: "Flip Three", style: "flip7-card-fliptweet" },
      { key: "ACT_FREEZE", label: "Freeze", style: "flip7-card-freeze" },
    ];

    function setTarget(target) {
      currentTarget = target;
      const btnMe = document.getElementById("btn-mode-me");
      const btnOther = document.getElementById("btn-mode-other");
      if (target === "me") {
        btnMe.className = "py-2.5 rounded-lg font-bold text-xs transition bg-emerald-600 text-white shadow-md";
        btnOther.className = "py-2.5 rounded-lg font-bold text-xs transition bg-slate-800 text-slate-400";
      } else {
        btnOther.className = "py-2.5 rounded-lg font-bold text-xs transition bg-indigo-600 text-white shadow-md";
        btnMe.className = "py-2.5 rounded-lg font-bold text-xs transition bg-slate-800 text-slate-400";
      }
    }

    async function sendCard(cardKey) {
      const res = await fetch(`${API_URL}/api/card`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ card: cardKey, target: currentTarget }),
      });
      updateUI(await res.json());
    }

    async function postAction(endpoint) {
      const res = await fetch(`${API_URL}${endpoint}`, { method: "POST" });
      updateUI(await res.json());
    }

    function updateUI(data) {
      document.getElementById("rem-total").textContent = data.remaining_total;
      document.getElementById("cur-score").textContent = data.current_score;
      document.getElementById("unique-cnt").textContent = `${data.unique_count} / 7`;
      document.getElementById("bust-risk").textContent = `${data.bust_risk}%`;
      document.getElementById("ev-val").textContent = data.expected_value;

      document.getElementById("prob-hit").textContent = `${data.prob_hit}%`;
      document.getElementById("prob-stop").textContent = `${data.prob_stop}%`;
      document.getElementById("bar-hit").style.width = `${data.prob_hit}%`;
      document.getElementById("bar-stop").style.width = `${data.prob_stop}%`;

      const recBox = document.getElementById("rec-box");
      const recText = document.getElementById("rec-text");
      recText.textContent = data.recommendation;

      if (data.busted) {
        recBox.className = "bg-slate-900 p-5 rounded-xl border-2 border-rose-500 flex flex-col justify-center items-center text-center shadow-xl";
        recText.className = "text-3xl font-black mt-1 text-rose-500";
      } else if (data.recommendation === "NOCH EINE") {
        recBox.className = "bg-slate-900 p-5 rounded-xl border-2 border-emerald-500 flex flex-col justify-center items-center text-center shadow-xl";
        recText.className = "text-3xl font-black mt-1 text-emerald-400";
      } else {
        recBox.className = "bg-slate-900 p-5 rounded-xl border-2 border-amber-500 flex flex-col justify-center items-center text-center shadow-xl";
        recText.className = "text-3xl font-black mt-1 text-amber-400";
      }

      // Eigene Hand rendern im Original-Kartenstil
      const handDiv = document.getElementById("my-hand-display");
      handDiv.innerHTML = "";
      if (data.hand_numbers.length === 0 && !data.has_second_chance && !data.has_x2 && data.bonus_cards.length === 0) {
        handDiv.innerHTML = '<span class="text-slate-500 text-xs italic">Noch keine eigenen Karten in dieser Runde...</span>';
      } else {
        data.hand_numbers.forEach(n => {
          handDiv.innerHTML += `
            <div class="flip7-card w-11 h-14 rounded-md flex flex-col items-center justify-center font-black text-lg shadow">
              <span>${n}</span>
            </div>`;
        });
        data.bonus_cards.forEach(b => {
          handDiv.innerHTML += `
            <div class="flip7-card-bonus w-12 h-14 rounded-md flex flex-col items-center justify-center font-black text-sm shadow">
              <span>+${b}</span>
            </div>`;
        });
        if (data.has_x2) {
          handDiv.innerHTML += `
            <div class="flip7-card-x2 w-12 h-14 rounded-md flex flex-col items-center justify-center font-black text-sm shadow">
              <span>×2</span>
            </div>`;
        }
        if (data.has_second_chance) {
          handDiv.innerHTML += `
            <div class="flip7-card-second w-16 h-14 rounded-md flex flex-col items-center justify-center font-bold text-[10px] text-center px-1 shadow">
              <span>2nd Chance</span>
            </div>`;
        }
      }

      // Zahlen-Grid Buttons
      const numGrid = document.getElementById("grid-numbers");
      numGrid.innerHTML = "";
      for (let i = 0; i <= 12; i++) {
        const key = `NUM_${i}`;
        const rem = data.deck_counts[key];
        const inHand = data.hand_numbers.includes(i);
        const disabled = rem <= 0 ? "opacity-30 cursor-not-allowed" : "hover:brightness-105 active:scale-95 cursor-pointer";
        const ring = inHand ? "ring-4 ring-rose-500" : "";

        numGrid.innerHTML += `
          <button ${rem <= 0 ? "disabled" : ""} onclick="sendCard('${key}')"
            class="flip7-card ${ring} ${disabled} rounded-xl h-20 flex flex-col items-center justify-center transition relative">
            <span class="absolute top-1.5 right-2 text-[10px] font-mono font-bold opacity-70">${rem}×</span>
            <span class="text-3xl font-black">${i}</span>
          </button>`;
      }

      // Spezial-Grid Buttons
      const specGrid = document.getElementById("grid-specials");
      specGrid.innerHTML = "";
      SPECIAL_CARDS.forEach(sc => {
        const rem = data.deck_counts[sc.key];
        const disabled = rem <= 0 ? "opacity-30 cursor-not-allowed" : "hover:brightness-110 active:scale-95 cursor-pointer";

        specGrid.innerHTML += `
          <button ${rem <= 0 ? "disabled" : ""} onclick="sendCard('${sc.key}')"
            class="${sc.style} ${disabled} rounded-xl h-16 flex flex-col items-center justify-center transition relative px-2 shadow-md">
            <span class="absolute top-1 right-2 text-[10px] font-mono font-bold opacity-80">${rem}×</span>
            <span class="text-xs font-black text-center">${sc.label}</span>
          </button>`;
      });
    }

    fetch(`${API_URL}/api/state`).then(r => r.json()).then(updateUI);
  </script>
</body>
</html>
